name: CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: [3.9]
        example:
          - "examples/w60x-arduino-blink"
          - "examples/w60x-arduino-wifi-http-test"
          - "examples/w60x-sdk-blink"
          - "examples/w60x-sdk-button-input"
          - "examples/w60x-sdk-wifi-scan"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix['python-version'] }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platform.json') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U https://github.com/platformio/platformio/archive/develop.zip

      - name: Install this custom platform
        run: |
          pio pkg install -p file://.
          platformio platform install file://.

      - name: Build ${{ matrix.example }}
        run: |
          platformio run -d ${{ matrix.example }}
